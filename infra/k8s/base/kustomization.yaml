apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vvaves-prod

resources:
  - namespace.yaml
  - s3-external-secret.yaml
  - vvaves.yaml

# An immutable date-sha tag produced by `sklp run publish`. Never `latest`.
# This is a floor, not a pin: argocd-image-updater rewrites it in place as
# newer tags reach the registry, so what is committed here is only the version
# a fresh cluster starts from.
images:
  - name: rg.fr-par.scw.cloud/lalternative/vvaves
    newTag: "20260901-0336-25c86d5159f8"

labels:
  - pairs:
      app.kubernetes.io/part-of: vvaves
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
