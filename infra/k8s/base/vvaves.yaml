apiVersion: v1
kind: Service
metadata:
  name: vvaves
  labels:
    app: vvaves
spec:
  type: ClusterIP
  selector:
    app: vvaves
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vvaves
  labels:
    app: vvaves
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: vvaves
  template:
    metadata:
      labels:
        app: vvaves
    spec:
      imagePullSecrets:
        - name: scw-registry-credentials
      containers:
        - name: vvaves
          image: rg.fr-par.scw.cloud/lalternative/vvaves
          imagePullPolicy: IfNotPresent
          env:
            # piper lives in the `ai` namespace, so it is
            # addressed across it rather than by bare service name.
            - name: PIPER_URL
              value: http://piper.ai.svc.cluster.local:5000
            - name: TTS_MODEL
              value: fr_FR-siwis-medium
            - name: TTS_VOICE
              value: fr_FR-siwis-medium
            # OVH, bucket vvaves-prod-audio: where a finished reading is
            # kept so the same text is never read twice, and where an opening
            # read ahead of time waits for the listener who presses play.
            # None of these three is a credential — only the two keys below
            # are, and they come from the Scaleway entry.
            - name: S3_ENDPOINT
              value: https://s3.gra.io.cloud.ovh.net
            - name: S3_REGION
              value: gra
            - name: S3_BUCKET
              value: vvaves-prod-audio
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vvaves-audio-creds
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vvaves-audio-creds
                  key: S3_SECRET_KEY
            # The applications' keys as "issuer:key" pairs, each presented on
            # X-Vvaves-Key and signing browser-bound /speak URLs. The
            # registry supersedes them. A listener's browser calls /speak
            # directly rather than through the application that authorised
            # it — a reading is tens of seconds of bytes, and relaying it
            # would have that application stream media for the whole of it.
            #
            # Left here and unset: this deployment has no ingress, so no
            # browser reaches it and there is no signature to check. It is
            # what the sklet deployment serves, on the name the DNS actually
            # points at. Setting it here would only matter if this cluster
            # were given a public name of its own.
            - name: SPEAK_KEYS
              valueFrom:
                secretKeyRef:
                  name: vvaves-speak-keys
                  key: SPEAK_KEYS
                  optional: true
            # The residential endpoint /fetch reads through. A publisher
            # behind bot management refuses this cluster's address whatever
            # headers the request carries — a browser User-Agent from here is
            # refused exactly like an honest one — so without it /fetch is
            # turned away by a growing share of the web it exists to read.
            #
            # Optional: unset, vvaves fetches direct and says so at startup.
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            # A render holds 300-500MB+ of Chromium while it runs, and the
            # limit is generous rather than tight because an OOM kill here
            # drops whatever page was mid-render, not just this request's
            # memory. Search and speech are thin by comparison — they ride
            # along with the browser's budget.
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # Chromium writes its shared memory here; the container's default
            # /dev/shm is 64Mi, which a real page blows through.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
