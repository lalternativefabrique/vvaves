version: 1
kind: deploy
name: vvaves

# The secrets a `sklp deploy` from a laptop expands: the same deploy-readable
# store the remote roll resolves from, so both paths read one source.
project_id: 7c56c44c-508e-4764-a1f8-9713e9ebcbbd

registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

services:
  app:
    image: rg.fr-par.scw.cloud/vvaves/core:20260923-0621-97cab4f9544a
    port: 8080
    depends_on: [migrate, postgres, searxng, tts, nats]
    env:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://vvaves:${POSTGRES_PASSWORD}@postgres:5432/vvaves?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      REGISTRY_ENCRYPTION_KEY: ${REGISTRY_ENCRYPTION_KEY}
      OIDC_ISSUER_URL: https://id.urbangate.dev
      OIDC_AUDIENCE: vvaves
      URBANGATE_PROVISIONER_CLIENT_ID: vvaves-provisioner
      URBANGATE_PROVISIONER_CLIENT_SECRET: ${URBANGATE_PROVISIONER_CLIENT_SECRET}
      SEARXNG_URL: http://searxng:8080
      NATS_URL: nats://nats:4222
      PIPER_URL: http://tts:5000
      TTS_MODEL: french_24l
      TTS_VOICE: estelle
      TTS_CONCURRENCY: "1"
      S3_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      S3_REGION: gra
      S3_BUCKET: vvaves-prod-audio
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      FETCH_PROXY: ${FETCH_PROXY}
    resources:
      cpu: "1"
      memory: 1536M
    ready:
      http: /healthz
      timeout: 60s

  web:
    image: rg.fr-par.scw.cloud/vvaves/web:20260923-0621-97cab4f9544a
    port: 5273
    depends_on: [postgres, app]
    env:
      PORT: "5273"
      NODE_ENV: production
      DATABASE_URL: postgres://vvaves:${POSTGRES_PASSWORD}@postgres:5432/vvaves?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://vvaves.dev
      JWT_SECRET: ${JWT_SECRET}
      CORE_API_URL: http://app:8080
      URBANGATE_ISSUER_URL: https://id.urbangate.dev
      URBANGATE_CLIENT_ID: vvaves-admin
      URBANGATE_CLIENT_SECRET: ${URBANGATE_CLIENT_SECRET}
      URBANGATE_PROVISIONER_CLIENT_ID: vvaves-provisioner
      URBANGATE_PROVISIONER_CLIENT_SECRET: ${URBANGATE_PROVISIONER_CLIENT_SECRET}
    resources:
      cpu: "0.5"
      memory: 512M
    ready:
      http: /admin/login
      timeout: 120s

  postgres:
    image: rg.fr-par.scw.cloud/platform-ops/postgres-pgbackrest-pg16:20260923-0744-052cb8cc8525
    port: 5432
    env:
      POSTGRES_USER: vvaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vvaves
      PGDATA: /var/lib/postgresql/data
      PGBACKREST_STANZA: vvaves
      PGBACKREST_REPO1_S3_ENDPOINT: s3.gra.io.cloud.ovh.net
      PGBACKREST_REPO1_S3_REGION: gra
      PGBACKREST_REPO1_S3_BUCKET: vvaves-prod-backups
      PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: gra
    volumes:
      - vvaves-pg-data:/var/lib/postgresql/data
      - vvaves-pg-backups:/backups
      - vvaves-wal-spool:/var/spool/pgbackrest
    command:
      [
        "postgres",
        "-c",
        "archive_mode=on",
        "-c",
        "archive_command=pgbackrest --stanza=vvaves archive-push %p",
        "-c",
        "wal_level=replica",
        "-c",
        "archive_timeout=60",
      ]
    backup:
      schedule: "0 3 * * *"
      command:
        [
          "sh",
          "-c",
          "apk add --no-cache aws-cli >/dev/null && f=vvaves-$(date +%F).sql.gz && pg_dump -U vvaves vvaves | gzip > /backups/$f && aws --endpoint-url https://s3.gra.io.cloud.ovh.net s3 cp /backups/$f s3://vvaves-prod-backups/postgres/$f && find /backups -name '*.sql.gz' -mtime +7 -delete",
        ]
    ready:
      log: "database system is ready to accept connections"
      timeout: 120s

  pgbackrest:
    image: rg.fr-par.scw.cloud/platform-ops/pgbackrest-sidecar-pg16:20260923-0744-052cb8cc8525
    depends_on: [postgres]
    volumes:
      - vvaves-pg-data:/var/lib/postgresql/data
      - vvaves-wal-spool:/var/spool/pgbackrest
    env:
      PGBACKREST_STANZA: vvaves
      PGHOST: postgres
      PGUSER: vvaves
      PGDATABASE: vvaves
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGBACKREST_REPO1_S3_ENDPOINT: s3.gra.io.cloud.ovh.net
      PGBACKREST_REPO1_S3_REGION: gra
      PGBACKREST_REPO1_S3_BUCKET: vvaves-prod-backups
      PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY}

  redis:
    image: redis:7-alpine
    port: 6379
    command: ["redis-server", "--save", "60", "1"]
    volumes: ["redis-data:/data"]
    ready:
      tcp: "6379"
      timeout: 60s

  nats:
    image: nats:2.12-alpine
    port: 4222
    volumes: ["nats-data:/data"]
    command: ["nats-server", "-js", "-sd", "/data"]
    env:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: gra
    backup:
      schedule: "*/30 * * * *"
      command:
        [
          "sh",
          "-c",
          "apk add --no-cache aws-cli >/dev/null && f=nats-$(date +%FT%H%M).tar.gz && tar czf /tmp/$f -C /data . && aws --endpoint-url https://s3.gra.io.cloud.ovh.net s3 cp /tmp/$f s3://vvaves-prod-backups/nats/$f && rm -f /tmp/$f",
        ]
    resources:
      cpu: "250m"
      memory: 256M
    ready:
      log: "Server is ready"
      timeout: 30s

  searxng:
    image: docker.io/searxng/searxng@sha256:e45d5894bfaa0bf8773b9f283795ae57f1c15ddb29c8cecb70b3665b0ce9ec60
    port: 8080
    depends_on: [redis, searxng-config]
    volumes: ["searxng-config:/etc/searxng"]
    env:
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_REDIS_URL: redis://redis:6379/0
    ready:
      http: /search?q=ping&format=json
      timeout: 120s

  tts:
    image: rg.fr-par.scw.cloud/vvaves/tts:20260923-0621-97cab4f9544a
    port: 5000
    env:
      LISTEN_ADDR: 0.0.0.0:5000
      TTS_MODEL: french_24l
      # Measured on this node, not derived: one reading runs at 1.5x real
      # time, three at 0.75x. Two is where each listener still keeps up. The
      # dev stack, on faster cores, holds four.
      TTS_LIVE_SLOTS: "2"
      TTS_BACKGROUND_SLOTS: "1"
      RAYON_NUM_THREADS: "3"
    volumes: ["tts-hf-cache:/home/tts/.cache/huggingface"]
    resources:
      cpu: "3"
      memory: 3584M
    ready:
      http: /healthz
      timeout: 600s

jobs:
  migrate:
    image: rg.fr-par.scw.cloud/vvaves/migrate:20260923-0621-97cab4f9544a
    command:
      [
        "postgres://vvaves:${POSTGRES_PASSWORD}@postgres:5432/vvaves?sslmode=disable",
        "up",
      ]
    depends_on: [postgres]

  searxng-config:
    image: alpine:3.21
    volumes: ["searxng-config:/etc/searxng"]
    command:
      - sh
      - -c
      - |
        set -eu
        # settings_defaults.py declares secret_key with no default and raises on
        # a non-str, so searxng refuses to boot without one. The volume already
        # holds the key this space has been running on: carry it over rather
        # than mint a new one, and fall back to a fresh key on a blank volume.
        key=$(sed -n 's/^ *secret_key: *"\(.*\)"$/\1/p' /etc/searxng/settings.yml 2>/dev/null | head -1)
        if [ -z "$key" ]; then
          key=$(tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 32)
        fi
        cat > /etc/searxng/settings.yml <<YAML
        use_default_settings: true
        general:
          instance_name: "Synthiz Search"
        server:
          secret_key: "$key"
          limiter: false
        search:
          safe_search: 0
          autocomplete: ""
          # Per-request "language" wins; this only covers callers that send none.
          default_lang: "fr"
          formats:
            - html
            - json
        outgoing:
          # A search waits for its slowest engine, so this timeout IS the floor of
          # the response time whenever one of them is down: a blocked engine costs
          # the full budget on every single query. Measured healthy engines answer
          # in 0.4-2.9s, so 3.0 keeps them all and stops paying 5s for the dead.
          request_timeout: 3.0
          max_request_timeout: 10.0
          pool_connections: 100
          pool_maxsize: 20
          enable_http2: true
        engines:
          - name: youtube
            disabled: false
          - name: bing
            disabled: false
          - name: wikipedia
            disabled: false
          - name: wikidata
            disabled: false
          - name: google cse
            disabled: false
          # duckduckgo_web targets duckduckgo.com instead of the CAPTCHA-gated
          # html.duckduckgo.com; upstream ships it disabled and it ignores the
          # language parameter (searxng PR #6192).
          - name: duckduckgo web
            disabled: false
          - name: openalex
            disabled: false
          - name: crossref
            disabled: false
          # Blocked or broken on every measured query, yet still queried on an
          # explicit category request, where each one costs the full
          # request_timeout before the search can return: google scholar answers
          # "Suspended: access denied", semantic scholar "parsing error", and
          # pubmed (a biomedical index) returns nothing on humanities queries.
          - name: google scholar
            inactive: true
          - name: semantic scholar
            inactive: true
          - name: pubmed
            inactive: true
          # openlibrary times out on every general query and only indexes books;
          # it belongs to the books category, not to source discovery.
          - name: openlibrary
            inactive: true
          # Permanently blocked from a datacenter IP: /sorry/ redirect (google),
          # Anubis proof-of-work (brave), CAPTCHA (startpage, html.duckduckgo).
          # A residential proxy does not defeat any of them: verified 2026-08-17.
          - name: google
            disabled: true
          - name: duckduckgo
            disabled: true
          - name: brave
            disabled: true
          - name: startpage
            disabled: true
          - name: arxiv
            inactive: true
        YAML

  restore-check:
    image: rg.fr-par.scw.cloud/platform-ops/postgres-pgbackrest-pg16:20260923-0744-052cb8cc8525
    command: ["pgbackrest-restore-check"]
    schedule: "30 4 * * *"
    depends_on: [postgres]
    resources:
      cpu: "1"
      memory: 1G
    env:
      PGBACKREST_STANZA: vvaves
      PGBACKREST_REPO1_S3_ENDPOINT: s3.gra.io.cloud.ovh.net
      PGBACKREST_REPO1_S3_REGION: gra
      PGBACKREST_REPO1_S3_BUCKET: vvaves-prod-backups
      PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY}
      POSTGRES_USER: vvaves
      POSTGRES_DB: vvaves
      SKALPAI_ENDPOINT: https://api.skalpai.dev
      SKALPAI_API_KEY: ${SKALPAI_API_KEY}
      SKALPAI_SPACE: vvaves-production

spaces:
  vvaves-production:
    gateway:
      routes:
        - service: app
          host: vvaves.dev
          path: /speak
          kind: expensive
          security_headers: true
          timeout: "0"
        - service: web
          host: vvaves.dev
          path: /
          kind: web
          security_headers: true
        - service: app
          host: vvaves.dev
          path: /openapi.json
          security_headers: true
        - service: app
          host: vvaves.dev
          path: /healthz
          security_headers: true
