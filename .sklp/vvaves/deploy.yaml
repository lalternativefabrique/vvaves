version: 1
kind: deploy
name: vvaves

# The secrets a `sklp deploy` from a laptop expands: the same deploy-readable
# store the remote roll resolves from, so both paths read one source.
project_id: 7c56c44c-508e-4764-a1f8-9713e9ebcbbd

registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

services:
  app:
    image: rg.fr-par.scw.cloud/vvaves/core:20260922-1431-f1390bde3007
    port: 8080
    depends_on: [migrate, postgres, searxng, tts, nats]
    env:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://vvaves:${POSTGRES_PASSWORD}@postgres:5432/vvaves?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      REGISTRY_ENCRYPTION_KEY: ${REGISTRY_ENCRYPTION_KEY}
      OIDC_ISSUER_URL: https://id.urbangate.dev
      OIDC_AUDIENCE: vvaves
      URBANGATE_PROVISIONER_CLIENT_ID: vvaves-provisioner
      URBANGATE_PROVISIONER_CLIENT_SECRET: ${URBANGATE_PROVISIONER_CLIENT_SECRET}
      SEARXNG_URL: http://searxng:8080
      NATS_URL: nats://nats:4222
      PIPER_URL: http://tts:5000
      TTS_MODEL: french_24l
      TTS_VOICE: estelle
      TTS_CONCURRENCY: "1"
      S3_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      S3_REGION: gra
      S3_BUCKET: vvaves-prod-audio
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      FETCH_PROXY: ${FETCH_PROXY}
    resources:
      cpu: "1"
      memory: 1536M
    ready:
      http: /healthz
      timeout: 60s

  web:
    image: rg.fr-par.scw.cloud/vvaves/web:20260922-1903-265eb2e3b058
    port: 5273
    depends_on: [postgres, app]
    env:
      PORT: "5273"
      NODE_ENV: production
      DATABASE_URL: postgres://vvaves:${POSTGRES_PASSWORD}@postgres:5432/vvaves?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://vvaves.dev
      JWT_SECRET: ${JWT_SECRET}
      CORE_API_URL: http://app:8080
      URBANGATE_ISSUER_URL: https://id.urbangate.dev
      URBANGATE_CLIENT_ID: vvaves-admin
      URBANGATE_CLIENT_SECRET: ${URBANGATE_CLIENT_SECRET}
      URBANGATE_PROVISIONER_CLIENT_ID: vvaves-provisioner
      URBANGATE_PROVISIONER_CLIENT_SECRET: ${URBANGATE_PROVISIONER_CLIENT_SECRET}
    resources:
      cpu: "0.5"
      memory: 512M
    ready:
      http: /admin/login
      timeout: 120s

  postgres:
    image: postgres:16-alpine
    port: 5432
    env:
      POSTGRES_USER: vvaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vvaves
    volumes: ["vvaves-pg-data:/var/lib/postgresql/data"]
    ready:
      tcp: "5432"
      timeout: 60s

  redis:
    image: redis:7-alpine
    port: 6379
    command: ["redis-server", "--save", "60", "1"]
    volumes: ["redis-data:/data"]
    ready:
      tcp: "6379"
      timeout: 60s

  nats:
    image: nats:2.12-alpine
    port: 4222
    volumes: ["nats-data:/data"]
    command: ["nats-server", "-js", "-sd", "/data"]
    resources:
      cpu: "250m"
      memory: 256M
    ready:
      log: "Server is ready"
      timeout: 30s

  searxng:
    image: docker.io/searxng/searxng@sha256:e45d5894bfaa0bf8773b9f283795ae57f1c15ddb29c8cecb70b3665b0ce9ec60
    port: 8080
    depends_on: [redis, searxng-config]
    volumes: ["searxng-config:/etc/searxng"]
    env:
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_REDIS_URL: redis://redis:6379/0
    ready:
      http: /search?q=ping&format=json
      timeout: 120s

  tts:
    image: rg.fr-par.scw.cloud/vvaves/tts:20260917-0742-77863e069ee5
    port: 5000
    env:
      LISTEN_ADDR: 0.0.0.0:5000
      TTS_MODEL: french_24l
      # Measured on this node, not derived: one reading runs at 1.5x real
      # time, three at 0.75x. Two is where each listener still keeps up. The
      # dev stack, on faster cores, holds four.
      TTS_LIVE_SLOTS: "2"
      TTS_BACKGROUND_SLOTS: "1"
      RAYON_NUM_THREADS: "3"
    volumes: ["tts-hf-cache:/home/tts/.cache/huggingface"]
    resources:
      cpu: "3"
      memory: 3584M
    ready:
      http: /healthz
      timeout: 600s

jobs:
  migrate:
    image: rg.fr-par.scw.cloud/vvaves/migrate:20260922-1641-b7bc422f25aa
    command:
      [
        "postgres://vvaves:${POSTGRES_PASSWORD}@postgres:5432/vvaves?sslmode=disable",
        "up",
      ]
    depends_on: [postgres]

  searxng-config:
    image: alpine:3.21
    volumes: ["searxng-config:/etc/searxng"]
    command:
      - sh
      - -c
      - |
        set -eu
        # settings_defaults.py declares secret_key with no default and raises on
        # a non-str, so searxng refuses to boot without one. The volume already
        # holds the key this space has been running on: carry it over rather
        # than mint a new one, and fall back to a fresh key on a blank volume.
        key=$(sed -n 's/^ *secret_key: *"\(.*\)"$/\1/p' /etc/searxng/settings.yml 2>/dev/null | head -1)
        if [ -z "$key" ]; then
          key=$(tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 32)
        fi
        cat > /etc/searxng/settings.yml <<YAML
        use_default_settings: true
        general:
          instance_name: "Synthiz Search"
        server:
          secret_key: "$key"
          limiter: false
        search:
          safe_search: 0
          autocomplete: ""
          # Per-request "language" wins; this only covers callers that send none.
          default_lang: "fr"
          formats:
            - html
            - json
        outgoing:
          # A search waits for its slowest engine, so this timeout IS the floor of
          # the response time whenever one of them is down: a blocked engine costs
          # the full budget on every single query. Measured healthy engines answer
          # in 0.4-2.9s, so 3.0 keeps them all and stops paying 5s for the dead.
          request_timeout: 3.0
          max_request_timeout: 10.0
          pool_connections: 100
          pool_maxsize: 20
          enable_http2: true
        engines:
          - name: youtube
            disabled: false
          - name: bing
            disabled: false
          - name: wikipedia
            disabled: false
          - name: wikidata
            disabled: false
          - name: google cse
            disabled: false
          # duckduckgo_web targets duckduckgo.com instead of the CAPTCHA-gated
          # html.duckduckgo.com; upstream ships it disabled and it ignores the
          # language parameter (searxng PR #6192).
          - name: duckduckgo web
            disabled: false
          - name: openalex
            disabled: false
          - name: crossref
            disabled: false
          # Blocked or broken on every measured query, yet still queried on an
          # explicit category request, where each one costs the full
          # request_timeout before the search can return: google scholar answers
          # "Suspended: access denied", semantic scholar "parsing error", and
          # pubmed (a biomedical index) returns nothing on humanities queries.
          - name: google scholar
            inactive: true
          - name: semantic scholar
            inactive: true
          - name: pubmed
            inactive: true
          # openlibrary times out on every general query and only indexes books;
          # it belongs to the books category, not to source discovery.
          - name: openlibrary
            inactive: true
          # Permanently blocked from a datacenter IP: /sorry/ redirect (google),
          # Anubis proof-of-work (brave), CAPTCHA (startpage, html.duckduckgo).
          # A residential proxy does not defeat any of them: verified 2026-08-17.
          - name: google
            disabled: true
          - name: duckduckgo
            disabled: true
          - name: brave
            disabled: true
          - name: startpage
            disabled: true
          - name: arxiv
            inactive: true
        YAML

spaces:
  vvaves-production:
    gateway:
      routes:
        - service: app
          host: vvaves.dev
          path: /speak
          kind: expensive
          security_headers: true
          timeout: "0"
        - service: app
          host: vvaves.dev
          path: /search
          kind: expensive
          rate: 20
          burst: 40
          security_headers: true
          timeout: 30s
        - service: app
          host: vvaves.dev
          path: /fetch
          kind: expensive
          rate: 20
          burst: 40
          security_headers: true
          timeout: 60s
        - service: app
          host: vvaves.dev
          path: /map
          kind: expensive
          rate: 5
          burst: 10
          security_headers: true
          timeout: 60s
        - service: app
          host: vvaves.dev
          path: /crawl
          kind: expensive
          rate: 10
          burst: 20
          security_headers: true
          timeout: 30s
        - service: app
          host: vvaves.dev
          path: /render
          kind: expensive
          rate: 10
          burst: 20
          security_headers: true
          timeout: 60s
        - service: web
          host: vvaves.dev
          path: /
          security_headers: true
