version: 1
kind: deploy
name: restore

registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

jobs:
  drill-postgres:
    image: rg.fr-par.scw.cloud/platform-ops/restore-drill-pg16:20260927-0459-2c6c7e5f13e4
    schedule: "20 5 * * *"
    volumes: ["drill-postgres:/scratch"]
    resources:
      cpu: "1"
      memory: 1G
    env:
      DRILL_ENGINE: postgres
      DRILL_SPACE: vvaves-production
      PG_STANZA: vvaves
      PG_USER: vvaves
      S3_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      S3_REGION: gra
      S3_BUCKET: vvaves-prod-backups
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SKALPAI_ENDPOINT: https://api.skalpai.dev
      SKALPAI_API_KEY: ${SKALPAI_API_KEY}

  drill-nats:
    image: rg.fr-par.scw.cloud/platform-ops/restore-drill-nats:20260927-0459-2c6c7e5f13e4
    schedule: "30 5 * * *"
    volumes: ["drill-nats:/scratch"]
    resources:
      cpu: "500m"
      memory: 512M
    env:
      DRILL_ENGINE: nats
      DRILL_SPACE: vvaves-production
      NATS_PREFIX: "nats/"
      S3_ENDPOINT: https://s3.gra.io.cloud.ovh.net
      S3_REGION: gra
      S3_BUCKET: vvaves-prod-backups
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SKALPAI_ENDPOINT: https://api.skalpai.dev
      SKALPAI_API_KEY: ${SKALPAI_API_KEY}

spaces:
  vvaves-restore: {}
