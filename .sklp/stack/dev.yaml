version: 1
kind: devstack
name: dev

# The whole platform on one machine: the deployments of .sklp/deploy-root.yaml
# (app, tts) in a single space, reached by service name exactly
# as in production.
env_files:
  - .env

services:
  # Built from source like the app: the image only exists once publish has
  # run on main. The model weights are fetched from Hugging Face on first
  # start into the host's own cache.
  tts:
    run: cargo run --release -p vvaves-tts
    workdir: apps/tts
    port: 5000
    env:
      LISTEN_ADDR: 0.0.0.0:5000
      TTS_MODEL: french_24l
      TTS_LIVE_SLOTS: "4"
      TTS_BACKGROUND_SLOTS: "1"
      RAYON_NUM_THREADS: "3"
    ready:
      http: /healthz
      timeout: 900s

  nats:
    image: nats:2-alpine
    network: bridge
    port: 4222
    command: ["-js"]
    ready:
      log: "Server is ready"
      timeout: 15s

  postgres:
    image: postgres:16-alpine
    network: bridge
    port: 5432
    env:
      POSTGRES_USER: vvaves
      POSTGRES_PASSWORD: vvaves
      POSTGRES_DB: vvaves
    volumes: ["sklp-dev-vvaves-pg:/var/lib/postgresql/data"]
    ready:
      tcp: postgres:5432
      timeout: 30s

  # Applies apps/migrations before the app opens a connection. Production runs
  # the same files from the migrate image (apps/migrations/Dockerfile); the dev
  # stack has no image step, so the tool is fetched by `go run`.
  migrate:
    workdir: apps/migrations
    oneshot: true
    depends_on: [postgres]
    env:
      DATABASE_URL: postgres://vvaves:vvaves@postgres:5432/vvaves?sslmode=disable
    run: >-
      go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      -path . -database "$DATABASE_URL" up

  app:
    run: go run .
    workdir: apps/core
    port: 8080
    depends_on: [postgres, migrate, tts, nats]
    env:
      NATS_URL: nats://nats:4222
      PIPER_URL: http://tts:5000
      TTS_MODEL: french_24l
      TTS_VOICE: estelle
      SPEAK_UNGUARDED: "true"
      DATABASE_URL: postgres://vvaves:vvaves@postgres:5432/vvaves?sslmode=disable
      REGISTRY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ready:
      http: /healthz
      timeout: 120s

  # The admin and the customer screens. Nobody has an account here: the
  # suite's identity provider holds the people, reached with the secrets
  # of the dev clients (URBANGATE_CLIENT_SECRET and
  # URBANGATE_PROVISIONER_CLIENT_SECRET in .env).
  web:
    run: pnpm install --frozen-lockfile && pnpm --filter @vvaves/web dev
    port: 5273
    depends_on: [app]
    env:
      BETTER_AUTH_URL: http://localhost:5273
      CORE_API_URL: http://app:8080
      URBANGATE_ISSUER_URL: http://localhost:4444
      KRATOS_PUBLIC_URL: http://localhost:4433
      PORT: "5273"
    ready:
      http: /admin/login
      timeout: 300s
