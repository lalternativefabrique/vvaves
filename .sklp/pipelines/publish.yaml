version: 1
kind: pipeline
name: publish
space: false

registries:
  rg.fr-par.scw.cloud:
    username: nologin
    password: ${SCW_SECRET_KEY}

secrets:
  - SCW_SECRET_KEY

tag:
  strategy: date-sha

on:
  branches: [main]
  clean_tree: true

scopes:
  app:
    - "apps/core/**"
    - "client/**"
    - "signed/**"
    - "go.work"
    - "go.mod"
    - "go.sum"
    - "Dockerfile"
  web:
    - "apps/web/**"
    - "lib/front/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "Dockerfile.web"
  migrate:
    - "apps/migrations/**"
  tts:
    - "apps/tts/**"
    - "Dockerfile.tts"

steps:
  - name: app-image
    kind: publish
    scope: [app]
    context: .
    dockerfile: Dockerfile
    image: rg.fr-par.scw.cloud/vvaves/core
    tag: "{{ publish_tag }}"

  - name: web-image
    kind: publish
    scope: [web]
    context: .
    dockerfile: Dockerfile.web
    image: rg.fr-par.scw.cloud/vvaves/web
    tag: "{{ publish_tag }}"

  - name: migrate-image
    kind: publish
    scope: [migrate]
    scan: false
    context: apps/migrations
    dockerfile: apps/migrations/Dockerfile
    image: rg.fr-par.scw.cloud/vvaves/migrate
    tag: "{{ publish_tag }}"

  - name: tts-image
    kind: publish
    scope: [tts]
    context: .
    dockerfile: Dockerfile.tts
    image: rg.fr-par.scw.cloud/vvaves/tts
    tag: "{{ publish_tag }}"
