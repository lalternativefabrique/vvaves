version: 1
kind: pipeline
name: ci

tools:
  go: "1.26.0"
  node: "24.16.0"
  pnpm: "10.27.0"
  rust: "1.93.0"

on:
  branches: ['**', '!main']

scopes:
  facade:
    - "apps/core/**"
    - "client/**"
    - "signed/**"
    - "go.work"
    - "go.mod"
    - "go.sum"
    - "Dockerfile"
  migrate:
    - "apps/migrations/**"
  render:
    - "render/**"
  web:
    - "apps/web/**"
    - "lib/front/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  tts:
    - "apps/tts/**"
    - "Dockerfile.tts"

steps:
  - name: facade-test
    scope: [facade]
    tools: [go]
    run: |
      go build ./... ./apps/core/...
      go vet ./... ./apps/core/...
      go test ./... ./apps/core/...

  # The served contract is what every consumer generates its client from, so a
  # handler changed without regenerating would hand them a spec describing
  # routes this binary no longer has.
  - name: contract-current
    scope: [facade]
    tools: [go, node]
    workdir: apps/core
    run: |
      set -euo pipefail
      go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --parseDependency --parseInternal -q --dir "./"
      cd docs
      npx -y swagger2openapi@7 swagger.json -o /tmp/openapi3.json
      diff -u contract/openapi3.json /tmp/openapi3.json || {
        echo "the committed contract is behind the handlers — run: sklp run generate" >&2
        exit 1
      }

  - name: migrate-check
    scope: [migrate]
    workdir: apps/migrations
    run: |
      for up in *.up.sql; do
        test -f "${up%.up.sql}.down.sql" || { echo "missing down for $up"; exit 1; }
      done

  - name: render-test
    scope: [render]
    tools: [node]
    workdir: render
    run: |
      npm install
      npm test

  - name: web-check
    scope: [web]
    tools: [node, pnpm]
    run: |
      pnpm install --frozen-lockfile
      pnpm --filter @vvaves/web lint
      pnpm --filter @vvaves/web typecheck
      pnpm --filter @vvaves/web test

  - name: tts-test
    scope: [tts]
    tools: [rust]
    run: |
      cd apps/tts
      cargo build --release --workspace
      cargo test --release --workspace
