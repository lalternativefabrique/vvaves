version: 1
kind: pipeline
name: ci

tools:
  go: "1.26.0"
  node: "24.16.0"
  pnpm: "10.27.0"
  rust: "1.93.0"
  gitleaks: "8.18.4"

on:
  branches: ['**', '!main']

scopes:
  facade:
    - "apps/core/**"
    - "Dockerfile"
  migrate:
    - "apps/migrations/**"
  web:
    - "apps/web/**"
    - "lib/front/**"
    - "package.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
  tts:
    - "apps/tts/**"
    - "Dockerfile.tts"

steps:
  # Unscoped: a key can land in any file. This repository is public, so a
  # secret that reaches main is published and must be revoked, not deleted.
  - name: gitleaks
    tools: [gitleaks]
    run: |
      if git rev-parse --git-dir >/dev/null 2>&1; then
        gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      else
        gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact --exit-code 1
      fi

  - name: facade-test
    scope: [facade]
    tools: [go]
    run: |
      cd apps/core
      go build ./...
      go vet ./...
      go test ./...

  # The served contract is what every consumer generates its client from, so a
  # handler changed without regenerating would hand them a spec describing
  # routes this binary no longer has.
  - name: contract-current
    scope: [facade]
    tools: [go, node]
    cwd: apps/core
    run: |
      set -euo pipefail
      go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --parseDependency --parseInternal -q --dir "./"
      cd docs
      npx -y swagger2openapi@7 swagger.json -o /tmp/openapi3.json
      diff -u contract/openapi3.json /tmp/openapi3.json || {
        echo "the committed contract is behind the handlers — run: sklp run generate" >&2
        exit 1
      }

  - name: migrate-check
    scope: [migrate]
    cwd: apps/migrations
    run: |
      for up in *.up.sql; do
        test -f "${up%.up.sql}.down.sql" || { echo "missing down for $up"; exit 1; }
      done


  - name: web-check
    scope: [web]
    tools: [node, pnpm]
    run: |
      pnpm install --frozen-lockfile
      pnpm --filter @vvaves/web lint
      pnpm --filter @vvaves/web typecheck
      pnpm --filter @vvaves/web test

  - name: tts-test
    scope: [tts]
    tools: [rust]
    run: |
      cd apps/tts
      cargo build --release --workspace
      cargo test --release --workspace
