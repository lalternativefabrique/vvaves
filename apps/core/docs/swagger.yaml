basePath: /
definitions:
  httpapi.errorResponse:
    properties:
      error:
        type: string
    type: object
  httpapi.existsResponse:
    properties:
      ready:
        type: boolean
    type: object
  httpapi.healthResponse:
    properties:
      ok:
        type: boolean
    type: object
  httpapi.speakRequest:
    properties:
      id:
        type: string
      scope:
        description: |-
          Scope and ID name where a reading is kept. Both optional: an ID lets a
          caller prime a reading before anyone asks for it, since priming means
          naming ahead of time what will be listened to. Without one the reading
          is still cached, keyed by the text alone — a second listen of the same
          words finds it, which no caller has to opt into.
        type: string
      stream:
        type: boolean
      text:
        type: string
    type: object
  keys.CreateKeyRequest:
    properties:
      label:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  keys.CreatedKeyDTO:
    properties:
      audience:
        items:
          type: string
        type: array
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      label:
        type: string
      scopes:
        items:
          type: string
        type: array
      secret:
        type: string
    type: object
  keys.ErrorDTO:
    properties:
      error:
        type: string
    type: object
  keys.KeyDTO:
    properties:
      audience:
        items:
          type: string
        type: array
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      label:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  keys.KeyListDTO:
    properties:
      keys:
        items:
          $ref: '#/definitions/keys.KeyDTO'
        type: array
    type: object
  registry.AppDTO:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      grace_until:
        type: string
      last4:
        type: string
      name:
        type: string
      revoked_at:
        type: string
      rotated_at:
        type: string
    type: object
  registry.AppListDTO:
    properties:
      apps:
        items:
          $ref: '#/definitions/registry.AppDTO'
        type: array
    type: object
  registry.CredentialsDTO:
    properties:
      grace_until:
        type: string
      key:
        type: string
      name:
        type: string
    type: object
  registry.ErrorDTO:
    properties:
      error:
        type: string
    type: object
  registry.RegisterRequest:
    properties:
      name:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Read text aloud for every product, plus the admin API of the applications registry.

    The speak routes answer at the root; the admin API is under
    /api/v1, which is why no global base path is declared.
  title: Vvaves
  version: 0.3.0
paths:
  /api/keys:
    get:
      operationId: listKeys
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/keys.KeyListDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
      security:
      - BearerAuth: []
      summary: List the caller's keys for this product
      tags:
      - keys
    post:
      consumes:
      - application/json
      description: The key is signed by urbangate and returned once; it is stored
        nowhere.
      operationId: createKey
      parameters:
      - description: Label, and optionally the scopes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/keys.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/keys.CreatedKeyDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
      security:
      - BearerAuth: []
      summary: Issue a key the caller's application will present to this product
      tags:
      - keys
  /api/keys/{id}:
    delete:
      description: 'Recorded before the key is dropped: a 503 left the key working,
        and retrying is safe.'
      operationId: revokeKey
      parameters:
      - description: The key's id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/keys.ErrorDTO'
      security:
      - BearerAuth: []
      summary: Revoke one of the caller's keys
      tags:
      - keys
  /api/v1/admin/apps:
    get:
      operationId: listApps
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/registry.AppListDTO'
      security:
      - BearerAuth: []
      summary: Every registered application, key withheld
      tags:
      - admin
    post:
      consumes:
      - application/json
      operationId: registerApp
      parameters:
      - description: The issuer name the application signs as
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/registry.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/registry.CredentialsDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/registry.ErrorDTO'
      security:
      - BearerAuth: []
      summary: Admit an application and hand its key out once
      tags:
      - admin
  /api/v1/admin/apps/{name}:
    delete:
      operationId: revokeApp
      parameters:
      - description: Application name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/registry.ErrorDTO'
      security:
      - BearerAuth: []
      summary: End an application's access at once
      tags:
      - admin
  /api/v1/admin/apps/{name}/rotate:
    post:
      operationId: rotateAppKey
      parameters:
      - description: Application name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/registry.CredentialsDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/registry.ErrorDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/registry.ErrorDTO'
      security:
      - BearerAuth: []
      summary: Mint an application a new key; the old one works for a day
      tags:
      - admin
  /healthz:
    get:
      operationId: healthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.healthResponse'
      summary: Liveness
      tags:
      - ops
  /speak:
    post:
      consumes:
      - application/json
      description: |-
        Answers audio bytes, not JSON. With stream=false the whole
        reading comes back with a Content-Length and ranges; with
        stream=true each piece is emitted as it is read, length-prefixed
        under application/x-lalter-audio-frames.
      operationId: speak
      parameters:
      - description: text to read
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.speakRequest'
      produces:
      - audio/mpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - ServiceKey: []
      - BearerAuth: []
      summary: Read a text aloud, from the store when it is already there
      tags:
      - speak
  /speak/exists:
    post:
      consumes:
      - application/json
      operationId: speakExists
      parameters:
      - description: reading to look for
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.speakRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.existsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - ServiceKey: []
      - BearerAuth: []
      summary: Whether a reading is already stored, without reading its bytes
      tags:
      - speak
  /speak/pregenerate:
    post:
      consumes:
      - application/json
      description: |-
        For a text expected to be heard more than once. It holds a
        synthesis slot, so prefer /speak/prime for a text that may never
        be played. Takes an application key.
      operationId: pregenerateSpeak
      parameters:
      - description: text to read in full
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.speakRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - ServiceKey: []
      - BearerAuth: []
      summary: Read a whole text ahead of time and keep it
      tags:
      - speak
  /speak/prime:
    post:
      consumes:
      - application/json
      description: |-
        Answers 202 without waiting: nobody is listening yet. Takes an
        application key — a browser signature is good for /speak alone.
      operationId: primeSpeak
      parameters:
      - description: text whose opening to read
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.speakRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.errorResponse'
      security:
      - ServiceKey: []
      - BearerAuth: []
      summary: Read a text's opening ahead of time, so the first listen starts at
        once
      tags:
      - speak
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
  ServiceKey:
    in: header
    name: X-Vvaves-Key
    type: apiKey
swagger: "2.0"
