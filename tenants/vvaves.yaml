# vvaves's Lungor catalogue. Apply with:
#   LUNGOR_API_URL=https://api.lungor.fr LUNGOR_WEB_URL=https://lungor.fr \
#   LUNGOR_TENANT_ID=<tenant> lungor provision tenants/vvaves.yaml --dry-run
#
# vvaves has no plan: it only declares what its speech providers cost, on
# itself, naming the client that caused it. Lungor charges the app a client is
# linked to in the console. Codes are audio.CostCode: <provider>/<model>.chars.
# The items are created by Lungor's Mistral price importer, not here:
# attaching one that was never imported fails the apply.
apps:
  - slug: vvaves
    name: Vvaves
    costs:
      - mistral/voxtral-mini-tts-latest.chars
